<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <title>IPTV VR Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#051019">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    :root{--bg:#051019;--accent:#00d4ff;--danger:#ff4444;--success:#39ff14;--warning:#ffbb00}
    *{box-sizing:border-box;font-family:sans-serif; -webkit-tap-highlight-color: transparent;}
    
    html, body { margin:0; padding:0; background:var(--bg); color:#e6eef6; height: 100%; overflow: hidden; }
    
    .container { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; max-width:980px; margin:0 auto; padding:15px; display: flex; flex-direction: column; position: relative; z-index: 1; }
    body.is-vr .container { display: none; }
    
    .input-section{display:flex; gap:8px; margin:8px 0; flex-wrap:wrap}
    input{padding:12px; border-radius:8px; border:1px solid #22303a; background:#0b1115; color:#fff; font-size:16px}
    #nameIn { flex: 1; min-width: 90px; }
    #urlIn { flex: 2; min-width: 140px; }
    
    button{border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; transition: 0.2s}
    button:active { transform: scale(0.95); opacity: 0.8; }
    .btn-load{background:var(--accent); color:#000}
    .btn-vr{background:#ff00ff; color:#fff}

    .channel-list { background:#071018; border-radius:10px; padding:5px; min-height: 150px; max-height: 350px; overflow-y: auto; border:1px solid #16202a; margin-bottom:15px; position: relative; z-index: 10; }
    .channel-item{padding:12px; border-bottom:1px solid #16202a; cursor:pointer; display:flex; justify-content:space-between; align-items:center}
    .channel-item:hover { background: #111b25; }
    .channel-item.active{border-left:4px solid var(--accent); background:#111b25}
    
    #vr-layer { display:none; position:fixed; inset:0; z-index:10000; background:#000}
    body.is-vr #vr-layer { display:block }
    #vr-divider { position: fixed; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.4); z-index: 10002; transform: translateX(-50%); pointer-events: none; }
    #vr-click-surface { position:fixed; inset:0; z-index:10005; background: transparent; cursor: pointer; touch-action: none; }
    #btn-exit-vr { position:fixed; top:20px; right:20px; z-index:10010; background:var(--danger); color:white; padding:15px 25px; border-radius:30px; font-weight:bold; border:2px solid white; }
    
    #feedback{ position:fixed; top:20%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:var(--accent); padding:15px 30px; border-radius:40px; display:none; z-index:20000; border:2px solid var(--accent); font-size: 20px; font-weight: bold; pointer-events:none; text-align: center;}

    .video-container{ background:#000; border-radius:12px; position:relative; overflow:hidden; width:100%; aspect-ratio: 16 / 9; border:1px solid #22303a; margin-top: 10px; margin-bottom: 30px; }
    #videoPlayer, #webFrame { width:100%; height:100%; border:none; display:none; position: absolute; top:0; left:0; }
    /* Superficie para gestos que NO bloquea la lista de canales */
    #normal-gesture-area { position:absolute; inset:0; z-index:5; display:block; cursor: pointer; }
  </style>

  <script type="importmap">{ "imports": { "hls.js": "https://esm.sh/hls.js@1.4.12" } }</script>
</head>
<body>

  <div id="feedback"></div>

  <div id="vr-layer">
    <div id="vr-divider"></div>
    <div id="vr-click-surface"></div>
    <button id="btn-exit-vr" onclick="window.toggleVR()">SALIR VR</button>
    <a-scene embedded loading-screen="enabled:false" vr-mode-ui="enabled:false">
      <a-entity camera look-controls="enabled: false" position="0 1.6 0">
        <a-entity id="vr-display-container" position="0 0 -3.6">
          <a-video id="screenLeft" src="#videoPlayer" width="4.4" height="2.47" position="-1.95 0 0" material="shader:flat"></a-video>
          <a-video id="screenRight" src="#videoPlayer" width="4.4" height="2.47" position="1.95 0 0" material="shader:flat"></a-video>
        </a-entity>
      </a-entity>
      <a-sky color="#000"></a-sky>
    </a-scene>
  </div>

  <div class="container">
    <h1 style="text-align:center; color:var(--accent); margin-bottom: 5px;">IPTV VR Pro</h1>
    
    <div class="input-section">
      <input id="nameIn" type="text" placeholder="Nombre..." />
      <input id="urlIn" type="text" placeholder="URL M3U8 o YouTube..." />
      <button onclick="window.addUrl()" class="btn-load">AÑADIR</button>
      <input type="file" id="fileIn" style="display:none" onchange="window.handleFile(this)" />
      <button onclick="document.getElementById('fileIn').click()" style="background:var(--success); color:white">M3U</button>
      <button onclick="window.clearAll()" style="background:var(--danger); color:white">BORRAR</button>
    </div>

    <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
        <button onclick="window.toggleFS()" style="background:#444; color:#fff">PANTALLA COMPLETA</button>
        <button onclick="window.toggleVR()" class="btn-vr">MODO VR (GAFAS)</button>
    </div>

    <div class="channel-list" id="list"></div>

    <div class="video-container" id="normalPlayerArea">
        <div id="normal-gesture-area"></div>
        <video id="videoPlayer" crossorigin="anonymous" playsinline controls></video>
        <iframe id="webFrame" allow="autoplay; fullscreen"></iframe>
    </div>
  </div>

  <script type="module">
    import Hls from "hls.js";

    // Canales por defecto integrados
    const defaultChannels = [
      {title:"YouTube Live 1", url:"https://youtu.be/vuTY4FDAbpA"},
      {title:"Spirit TV", url:"https://cdnlive.myspirit.tv/LS-ATL-43240-2/index.m3u8"},
      {title:"RT Español", url:"https://rt-esp.rttv.com/live/rtesp/playlist_800Kb.m3u8"},
      {title:"CNN Fast", url:"https://amg00803-cnnfast-amg00803c3-lg-es-5477.playouts.now.amagi.tv/playlist1080p.m3u8"},
      {title:"DW Español", url:"https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8"},
      {title:"3ABN Latino", url:"https://3abn.bozztv.com/3abn2/Lat_live/smil:Lat_live.smil/playlist.m3u8"},
      {title:"Retro Plus TV", url:"https://scl.edge.grupoz.cl/retroplustvuno/live/playlist.m3u8"}
    ];

    const state = JSON.parse(localStorage.getItem('iptv_vr_final')) || { channels: defaultChannels, current: 0, eyeGap: 1.95 };
    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('webFrame');
    const feedback = document.getElementById('feedback');
    let hls = null;

    window.saveState = () => localStorage.setItem('iptv_vr_final', JSON.stringify(state));

    window.playUrl = async (rawUrl, index) => {
      if(hls) { hls.destroy(); hls = null; }
      video.pause(); video.src = ""; video.load();
      iframe.src = "about:blank"; 
      iframe.style.display = "none"; video.style.display = "none";

      state.current = index; window.saveState(); render();

      const ytMatch = rawUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:v\/|u\/\w\/|embed\/|watch\?v=))([^#\&\?]*)/);

      if (ytMatch) {
        video.style.display = "none"; iframe.style.display = "block";
        iframe.src = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0`;
        showFeedback("Reproduciendo YouTube");
      } else {
        iframe.style.display = "none"; video.style.display = "block";
        if (Hls.isSupported()) {
          hls = new Hls(); hls.loadSource(rawUrl); hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
        } else { video.src = rawUrl; video.play().catch(()=>{}); }
        showFeedback(state.channels[index].title);
      }
      setTimeout(updateScreens, 400);
    };

    // --- GESTIÓN DE GESTOS (MÓVIL Y PC) ---
    let startY = 0, startX = 0, isDragging = false;
    const handleStart = (e) => {
        isDragging = true;
        const touch = e.touches ? e.touches[0] : e;
        startY = touch.clientY; startX = touch.clientX;
    };

    const handleEnd = (e) => {
        if (!isDragging) return;
        const touch = e.changedTouches ? e.changedTouches[0] : e;
        const diffY = startY - touch.clientY;
        const diffX = startX - touch.clientX;
        const xPosPercent = (startX / window.innerWidth) * 100;

        if (Math.abs(diffY) > 60) {
            // Calibración de ojos (Deslizar arriba/abajo)
            const delta = diffY > 0 ? 0.05 : -0.05;
            state.eyeGap = Math.max(1.50, Math.min(2.80, state.eyeGap + delta));
            updateScreens();
            showFeedback(`Ojos: ${state.eyeGap.toFixed(2)}`);
            window.saveState();
        } else if (Math.abs(diffX) > 80) {
            // Cambio de canal (Deslizar izquierda/derecha)
            const dir = diffX > 0 ? 1 : -1;
            const next = (state.current + dir + state.channels.length) % state.channels.length;
            window.playUrl(state.channels[next].url, next);
        } else if (Math.abs(diffY) < 10 && Math.abs(diffX) < 10) {
            // Click/Tap simple para Play/Pause
            if (video.style.display !== "none") {
                if (video.paused) { video.play(); showFeedback("PLAY"); }
                else { video.pause(); showFeedback("PAUSA"); }
            }
        }
        isDragging = false;
    };

    function updateScreens() {
        const L = document.getElementById('screenLeft'), R = document.getElementById('screenRight');
        if (L && R) {
            L.setAttribute('position', `-${state.eyeGap} 0 0`);
            R.setAttribute('position', `${state.eyeGap} 0 0`);
            L.setAttribute('src', '#videoPlayer');
            R.setAttribute('src', '#videoPlayer');
        }
    }

    [document.getElementById('normal-gesture-area'), document.getElementById('vr-click-surface')].forEach(el => {
        el.addEventListener('mousedown', handleStart);
        el.addEventListener('mouseup', handleEnd);
        el.addEventListener('touchstart', handleStart, {passive: false});
        el.addEventListener('touchend', handleEnd, {passive: false});
    });

    window.toggleVR = () => {
      const isVR = document.body.classList.toggle('is-vr');
      if (isVR) {
          document.documentElement.requestFullscreen?.().catch(()=>{});
          video.play().catch(()=>{}); updateScreens();
      } else {
          if(document.fullscreenElement) document.exitFullscreen();
      }
    };

    window.toggleFS = () => {
      const area = document.getElementById('normalPlayerArea');
      if (!document.fullscreenElement) area.requestFullscreen();
      else document.exitFullscreen();
    };

    window.addUrl = () => {
      const u = document.getElementById('urlIn'), n = document.getElementById('nameIn');
      if(u.value.trim()){
        state.channels.push({title: n.value.trim() || "Canal " + (state.channels.length + 1), url: u.value.trim()});
        u.value = ""; n.value = ""; window.saveState(); render();
      }
    };

    window.handleFile = (input) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const lines = e.target.result.split('\n');
            lines.forEach((line, i) => {
                if (line.startsWith('#EXTINF:')) {
                    const url = lines[i+1]?.trim();
                    if(url && !url.startsWith('#')) state.channels.push({title: line.split(',')[1] || "M3U Canal", url});
                }
            });
            window.saveState(); render();
        };
        reader.readAsText(input.files[0]);
    };

    window.clearAll = () => { if(confirm("¿Borrar todo?")) { state.channels = []; state.current = -1; window.saveState(); render(); } };

    function showFeedback(txt) { 
        feedback.textContent = txt; feedback.style.display = "block"; 
        setTimeout(() => feedback.style.display = "none", 1200); 
    }

    function render() {
      const listDiv = document.getElementById('list');
      listDiv.innerHTML = state.channels.map((ch, i) => `
        <div class="channel-item ${state.current === i ? 'active' : ''}" onclick="window.playUrl('${ch.url}', ${i})">
            <span><b>${i+1}.</b> ${ch.title}</span>
            <button style="background:none; color:var(--danger); font-size: 18px;" onclick="event.stopPropagation(); state.channels.splice(${i}, 1); window.saveState(); render();">✕</button>
         </div>`).join('') || '<div style="padding:15px; color:#666; text-align:center">Lista vacía</div>';
    }

    render();
    if(state.channels.length > 0) window.playUrl(state.channels[state.current].url, state.current);
  </script>
</body>
</html>
